[package]
name = "ip_tv-neon"
version = "0.9.1"
edition = "2024"
description = "Terminal IPTV & Radio player with EPG, timeshift, and AI assistant"
license = "MIT"
readme = "README.md"
keywords = ["iptv", "tui", "radio", "epg", "terminal"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "6.0"
flate2 = "1.1"
quick-xml = "0.37"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "process", "sync", "time", "fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
