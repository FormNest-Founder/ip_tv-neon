[package]
name = "ip_tv-neon"
version = "0.8.2"
edition = "2021"
description = "Terminal IPTV & Radio player with EPG, timeshift, and AI assistant"
license = "MIT"
readme = "README.md"
keywords = ["iptv", "tui", "radio", "epg", "terminal"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0"
bincode = "3.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "6.0"
flate2 = "1.1"
quick-xml = "0.37"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
libc = "0.2"
