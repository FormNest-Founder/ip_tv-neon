[package]
name = "ip_tv-neon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
flate2 = "1.1.5"
libc = "0.2.178"
quick-xml = { version = "0.38.4", features = ["serde"] }
regex = "1.12.2"
reqwest = { version = "0.12.28", features = ["json", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tokio = { version = "1.48.0", features = ["full"] }
urlencoding = "2.1.3"
