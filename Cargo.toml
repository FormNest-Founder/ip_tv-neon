[package]
name = "ip_tv-neon"
version = "0.8.2"
edition = "2021"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
dirs = "5.0"
flate2 = "1.0"
quick-xml = "0.31"
ratatui = "0.26"
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
libc = "0.2"
