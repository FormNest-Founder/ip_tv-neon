[package]
name = "ip_tv-neon"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
libc = "0.2"
quick-xml = { version = "0.31", features = ["serde"] }
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.36", features = ["full"] }
urlencoding = "2.1"
flate2 = "1.0"
dirs = "5.0"
ksni = "0.2" # Библиотека для системного трея (KDE/Linux)
